name: Portfolio CI and Pages

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'
  DART_VERSION: '3.13.7'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  verify:
    name: Analyze, Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Pages path resolver
        run: sh .github/scripts/test_base_href.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Verify SDK versions
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          jq -e --arg flutter "$FLUTTER_VERSION" --arg dart "$DART_VERSION" \
            '.frameworkVersion == $flutter and .channel == "stable" and .dartSdkVersion == $dart' \
            "$RUNNER_TEMP/flutter-version.json"
          flutter --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Resolve Pages base path
        id: base
        run: |
          base_href="$(sh .github/scripts/base_href.sh "$GITHUB_REPOSITORY")"
          printf 'value=%s\n' "$base_href" >> "$GITHUB_OUTPUT"

      - name: Build web
        env:
          BASE_HREF: ${{ steps.base.outputs.value }}
        run: flutter build web --no-pub --release --base-href "$BASE_HREF"

      - name: Upload Pages artifact
        if: >-
          ${{ github.event.repository.private == false &&
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web
          retention-days: 1

  deploy:
    name: Deploy Pages
    needs: verify
    if: >-
      ${{ needs.verify.result == 'success' &&
          github.event.repository.private == false &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
